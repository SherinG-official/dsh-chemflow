name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 这些测试**不需要** Multiwfn / VMD / 集群：纯解析 + 数值 + 客户端 bundle。
      - name: 单测
        run: npm test

      - name: 语法检查
        run: |
          fail=0
          while IFS= read -r f; do
            node --check "$f" || fail=1
          done < <(find lib scripts -type f \( -name '*.js' -o -name '*.mjs' \))
          exit $fail

      # 宿主插件能不能真的加载（宿主才有的包用 test/loader.mjs 换成桩）
      - name: 宿主插件加载
        run: |
          node --import ./test/register.mjs -e "
            import('./test/harness.mjs').then(async (m) => {
              const h = await m.createHarness();
              const expected = ['chem_env','chem_orca','chem_orca_states','chem_hole_electron','chem_orbital','chem_aromatic','chem_esp','chem_render','chem_view','chem_views','chem_multiwfn'];
              const missing = expected.filter((n) => !h.tools.has(n));
              if (missing.length) { console.error('缺工具:', missing); process.exit(1); }
              console.log('ok:', h.names.join(' '));
            });
          "
