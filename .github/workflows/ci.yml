name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 这些测试**不需要** Multiwfn / VMD / 集群：纯解析 + 数值 + 客户端 bundle。
      - name: 单测
        run: npm test

      - name: 语法检查
        run: |
          fail=0
          while IFS= read -r f; do
            node --check "$f" || fail=1
          done < <(find lib scripts -type f \( -name '*.js' -o -name '*.mjs' \))
          exit $fail

      # 宿主插件能不能真的加载（宿主才有的包用 test/loader.mjs 换成桩）
      # 工具名从 lib/index.js 的 TOOL_NAMES 取，避免这里和实现漂移。
      - name: 宿主插件加载
        run: |
          node --import ./test/register.mjs -e "
            Promise.all([import('./test/harness.mjs'), import('./lib/index.js')]).then(async ([m, index]) => {
              const h = await m.createHarness();
              const expected = index.TOOL_NAMES;
              const missing = expected.filter((n) => !h.tools.has(n));
              const extra = h.names.filter((n) => !expected.includes(n));
              if (missing.length) { console.error('缺工具:', missing); process.exit(1); }
              if (extra.length) { console.error('多出未登记的工具:', extra); process.exit(1); }
              console.log('ok:', expected.length, '个 →', h.names.join(' '));
            });
          "
